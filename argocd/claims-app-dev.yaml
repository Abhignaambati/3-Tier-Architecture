apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/midhtech-group2/3-tier-architecture.git
    targetRevision: usecase/05-helm-argocd
    path: helm/claims-app
    helm:
      releaseName: claims-app-gitops
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
