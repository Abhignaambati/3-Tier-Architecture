services:
  db:
    image: postgres:16-alpine
    container_name: claims-usecase8-db
    environment:
      POSTGRES_DB: claimsdb
      POSTGRES_USER: claimsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - usecase8-db-data:/var/lib/postgresql/data
      - ./database/init-usecase8.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsuser -d claimsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - usecase8

  backend:
    build:
      context: ./backend
    container_name: claims-usecase8-backend
    environment:
      DB_HOST: db
      DB_NAME: claimsdb
      DB_USER: claimsuser
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PORT: "5432"
    ports:
      - "5009:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - usecase8

  prometheus:
    image: prom/prometheus:latest
    container_name: claims-usecase8-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - usecase8-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - alertmanager
    networks:
      - usecase8

  alertmanager:
    image: prom/alertmanager:latest
    container_name: claims-usecase8-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - usecase8

  loki:
    image: grafana/loki:latest
    container_name: claims-usecase8-loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - usecase8-loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - usecase8

  alloy:
    image: grafana/alloy:latest
    container_name: claims-usecase8-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - usecase8-alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - usecase8

  grafana:
    image: grafana/grafana:latest
    container_name: claims-usecase8-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - usecase8-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - usecase8

networks:
  usecase8:
    name: claims-usecase8-network

volumes:
  usecase8-db-data:
  usecase8-prometheus-data:
  usecase8-grafana-data:
  usecase8-loki-data:
  usecase8-alloy-data:
