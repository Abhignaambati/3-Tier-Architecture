apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    environment: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-app
        app.kubernetes.io/instance: {{ .Release.Name }}
        environment: {{ .Values.environment }}
      annotations:
        usecase15.vault/path: {{ .Values.vault.path | quote }}
        usecase15.promotion/approval-required: {{ .Values.promotion.approvalRequired | quote }}
        usecase15.alerting/level: {{ .Values.alerting.level | quote }}
    spec:
      containers:
        - name: claims-app
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.secretName }}
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.secretName }}
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: application-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: application-content
              mountPath: /usr/share/nginx/html/health
              subPath: health
            - name: application-content
              mountPath: /usr/share/nginx/html/version
              subPath: version
            - name: application-content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: application-content
          configMap:
            name: {{ .Release.Name }}-content
