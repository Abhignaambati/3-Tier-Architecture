apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    environment: {{ .Values.environment }}
spec:
  selector:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
