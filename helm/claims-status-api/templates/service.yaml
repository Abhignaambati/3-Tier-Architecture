apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: claims-status-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    environment: {{ .Values.application.environment }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: claims-status-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
