apiVersion: v1
kind: Namespace
metadata:
  name: imagepull-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-app-content
  namespace: imagepull-lab
data:
  index.html: |
    <h1>Claims Application</h1>
    <p>Use Case 11 healthy deployment</p>
  health: |
    healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-app
  namespace: imagepull-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-app
  template:
    metadata:
      labels:
        app: claims-app
        environment: lab
    spec:
      containers:
        - name: claims-app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: application-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: application-content
          configMap:
            name: claims-app-content
---
apiVersion: v1
kind: Service
metadata:
  name: claims-app
  namespace: imagepull-lab
spec:
  selector:
    app: claims-app
  ports:
    - port: 80
      targetPort: http
