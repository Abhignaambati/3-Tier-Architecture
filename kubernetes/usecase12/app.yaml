apiVersion: v1
kind: Namespace
metadata:
  name: secret-rotation-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-secret-app-code
  namespace: secret-rotation-lab
data:
  app.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    secret = os.environ.get("APP_SECRET", "")
    secret_version = os.environ.get("SECRET_VERSION", "unknown")
    secret_valid = secret.startswith("uc12-") and len(secret) >= 20

    print(
        f"Secret validation {'passed' if secret_valid else 'failed'}; "
        f"version={secret_version}",
        flush=True,
    )

    class Handler(BaseHTTPRequestHandler):
        def send_json(self, status_code, payload):
            body = json.dumps(payload).encode()
            self.send_response(status_code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(
                    200 if secret_valid else 503,
                    {
                        "status": "healthy" if secret_valid else "unhealthy",
                        "secret_version": secret_version,
                    },
                )
            elif self.path == "/info":
                self.send_json(
                    200,
                    {
                        "service": "claims-secret-app",
                        "environment": "lab",
                        "secret_source": "kubernetes-secret",
                    },
                )
            else:
                self.send_json(404, {"error": "not found"})

        def log_message(self, message, *args):
            print(
                f"request={self.address_string()} "
                f"path={self.path} message={message % args}",
                flush=True,
            )

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-secret-app
  namespace: secret-rotation-lab
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: claims-secret-app
  template:
    metadata:
      labels:
        app: claims-secret-app
        environment: lab
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -u
            - /app/app.py
          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: app-token
            - name: SECRET_VERSION
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: application-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: application-code
          configMap:
            name: claims-secret-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: claims-secret-app
  namespace: secret-rotation-lab
spec:
  selector:
    app: claims-secret-app
  ports:
    - port: 80
      targetPort: http
