apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-policy-demo
  namespace: policy-lab
  labels:
    app: claims-policy-demo
    environment: lab
    team: claims
    managed-by: kubernetes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-policy-demo
  template:
    metadata:
      labels:
        app: claims-policy-demo
        environment: lab
        version: "1.0"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claims-policy-demo
  namespace: policy-lab
  labels:
    app: claims-policy-demo
    environment: lab
spec:
  selector:
    app: claims-policy-demo
  ports:
    - name: http
      port: 80
      targetPort: http
