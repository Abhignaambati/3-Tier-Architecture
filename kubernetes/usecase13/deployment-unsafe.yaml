apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-policy-demo
  namespace: policy-lab
  labels:
    app: claims-policy-demo
    environment: lab
    team: claims
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-policy-demo
  template:
    metadata:
      labels:
        app: claims-policy-demo
        environment: lab
        version: "1.0"
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
