apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-blue-content
  namespace: blue-green-lab
data:
  index.html: |
    Claims Application - Blue
  version: |
    blue-v1
  health: |
    healthy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-green-content
  namespace: blue-green-lab
data:
  index.html: |
    Claims Application - Green
  version: |
    green-v2
  health: |
    healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-blue
  namespace: blue-green-lab
  labels:
    app: claims-app
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-app
      version: blue
  template:
    metadata:
      labels:
        app: claims-app
        version: blue
    spec:
      containers:
        - name: claims-app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: application-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: application-content
          configMap:
            name: claims-blue-content
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-green
  namespace: blue-green-lab
  labels:
    app: claims-app
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-app
      version: green
  template:
    metadata:
      labels:
        app: claims-app
        version: green
    spec:
      containers:
        - name: claims-app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: application-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: application-content
          configMap:
            name: claims-green-content
---
apiVersion: v1
kind: Service
metadata:
  name: claims-app
  namespace: blue-green-lab
  labels:
    purpose: production-like
spec:
  selector:
    app: claims-app
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: claims-app-preview
  namespace: blue-green-lab
  labels:
    purpose: preview
spec:
  selector:
    app: claims-app
    version: green
  ports:
    - name: http
      port: 80
      targetPort: http
