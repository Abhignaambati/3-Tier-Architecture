apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-bad
  namespace: blue-green-lab
  labels:
    app: claims-app
    version: bad
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claims-app
      version: bad
  template:
    metadata:
      labels:
        app: claims-app
        version: bad
    spec:
      containers:
        - name: claims-app
          image: nginx:usecase14-image-does-not-exist
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
