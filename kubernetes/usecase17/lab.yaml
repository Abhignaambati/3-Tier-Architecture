apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usecase17-postgres-data
  namespace: backup-restore-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usecase17-backups
  namespace: backup-restore-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usecase17-minio-data
  namespace: backup-restore-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase17-postgres
  namespace: backup-restore-lab
  labels:
    app: usecase17-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: usecase17-postgres
  template:
    metadata:
      labels:
        app: usecase17-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: claimsdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: usecase17-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: usecase17-db-secret
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: usecase17-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: usecase17-postgres
  namespace: backup-restore-lab
spec:
  selector:
    app: usecase17-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase17-minio
  namespace: backup-restore-lab
  labels:
    app: usecase17-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: usecase17-minio
  template:
    metadata:
      labels:
        app: usecase17-minio
    spec:
      containers:
        - name: minio
          image: usecase17-minio-tools:source
          imagePullPolicy: Never
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: usecase17-minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: usecase17-minio-secret
                  key: root-password
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: usecase17-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: usecase17-minio
  namespace: backup-restore-lab
spec:
  selector:
    app: usecase17-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-reader
  namespace: backup-restore-lab
  labels:
    app: claims-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-reader
  template:
    metadata:
      labels:
        app: claims-reader
    spec:
      containers:
        - name: reader
          image: postgres:16-alpine
          command:
            - sleep
            - infinity
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: usecase17-db-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: usecase17-db-secret
                  key: password
            - name: PGHOST
              value: usecase17-postgres
            - name: PGDATABASE
              value: claimsdb
