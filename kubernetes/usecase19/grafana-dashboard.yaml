apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-slo-dashboard
  namespace: slo-monitoring
  labels:
    grafana_dashboard: "1"
data:
  claims-slo-dashboard.json: |
    {
      "title": "Claims API SLO - Use Case 19",
      "uid": "claims-usecase19-slo",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Availability SLI",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(claims_http_requests_total{path=\"/api/claims\",status!~\"5..\"}[5m])) / clamp_min(sum(rate(claims_http_requests_total{path=\"/api/claims\"}[5m])), 0.001)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Claims API Error Ratio",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(claims_http_requests_total{path=\"/api/claims\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(claims_http_requests_total{path=\"/api/claims\"}[5m])), 0.001)",
              "legendFormat": "5xx error ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 3,
          "title": "P95 Request Latency",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(claims_http_request_duration_seconds_bucket{path=\"/api/claims\"}[5m])))",
              "legendFormat": "P95 latency"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 4,
          "title": "Request Rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(claims_http_requests_total{path=\"/api/claims\"}[5m]))",
              "legendFormat": "HTTP {{status}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Error Budget Consumed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * ((sum(increase(claims_http_requests_total{path=\"/api/claims\",status=~\"5..\"}[30d])) / clamp_min(sum(increase(claims_http_requests_total{path=\"/api/claims\"}[30d])), 1)) / 0.01)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              }
            }
          }
        }
      ]
    }
