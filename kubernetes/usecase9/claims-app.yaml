apiVersion: v1
kind: Namespace
metadata:
  name: incident-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-app-content
  namespace: incident-lab
data:
  index.html: |
    <html>
      <body>
        <h1>Claims Application</h1>
        <p>Status: Running</p>
        <p>Environment: Incident Lab</p>
      </body>
    </html>
  health: |
    {"status":"healthy","service":"claims-app","environment":"incident-lab"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-app
  namespace: incident-lab
  labels:
    app: claims-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: claims-app
  template:
    metadata:
      labels:
        app: claims-app
        environment: incident-lab
    spec:
      containers:
        - name: claims-app
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: application-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: application-content
          configMap:
            name: claims-app-content
---
apiVersion: v1
kind: Service
metadata:
  name: claims-app
  namespace: incident-lab
spec:
  selector:
    app: claims-app
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
