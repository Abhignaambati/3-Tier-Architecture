global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: claims-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:5000
        labels:
          service: claims-backend
          environment: lab
          version: "1.0.0"
