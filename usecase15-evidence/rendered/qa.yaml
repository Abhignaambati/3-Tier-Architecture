---
# Source: claims-app/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-app-content
  labels:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: claims-app
    environment: qa
data:
  index.html: |
    Claims application
    Environment: qa
    Chart version: 1.0.0
  health: |
    healthy
  version: |
    claims-app-1.0.0
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location = /health {
        default_type text/plain;
        alias /usr/share/nginx/html/health;
      }

      location = /version {
        default_type text/plain;
        alias /usr/share/nginx/html/version;
      }
    }

---
# Source: claims-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: claims-app
  labels:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: claims-app
    environment: qa
spec:
  selector:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: claims-app
  ports:
    - name: http
      port: 80
      targetPort: http

---
# Source: claims-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-app
  labels:
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: claims-app
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-app
      app.kubernetes.io/instance: claims-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-app
        app.kubernetes.io/instance: claims-app
        environment: qa
      annotations:
        usecase15.vault/path: "secret/usecase15/qa/app"
        usecase15.promotion/approval-required: "false"
        usecase15.alerting/level: "basic"
    spec:
      containers:
        - name: claims-app
          image: "nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENVIRONMENT
              value: "qa"
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: claims-app-secret
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-app-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 150m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: application-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: application-content
              mountPath: /usr/share/nginx/html/health
              subPath: health
            - name: application-content
              mountPath: /usr/share/nginx/html/version
              subPath: version
            - name: application-content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: application-content
          configMap:
            name: claims-app-content
