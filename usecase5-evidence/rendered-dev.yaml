---
# Source: claims-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-app
  labels:
    helm.sh/chart: claims-app-0.1.0
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: claims-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-app
      app.kubernetes.io/instance: claims-app
  template:
    metadata:
      labels:
        helm.sh/chart: claims-app-0.1.0
        app.kubernetes.io/name: claims-app
        app.kubernetes.io/instance: claims-app
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      imagePullSecrets:
        - name: harbor-pull
      serviceAccountName: claims-app
      containers:
        - name: claims-app
          image: "192.168.1.121:80/3-tier/3-tier-app@sha256:0795d970f8f6f2ec26f180cc844e60fef949168917bb364ce2af7656cc41f764"
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: host.docker.internal
            - name: DB_PORT
              value: "15432"
            - name: DB_NAME
              value: claimsdb
            - name: DB_USER
              value: claimsuser
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: claims-db
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
---
# Source: claims-app/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "claims-app-test-connection"
  labels:
    helm.sh/chart: claims-app-0.1.0
    app.kubernetes.io/name: claims-app
    app.kubernetes.io/instance: claims-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['claims-app:5000']
  restartPolicy: Never

